<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share My Location</title>
<style>
body{font-family:Arial,sans-serif;max-width:520px;margin:40px auto;padding:20px;background:#f5f7fb}
.card{background:white;padding:24px;border-radius:18px;box-shadow:0 4px 20px #0001}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#1769e0;color:white;font-size:16px}
#result{margin-top:18px;line-height:1.6}
a{display:inline-block;margin-top:10px}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<div class="card">
<h2>📍 Share your location</h2>
<p>This page will ask for your browser's location permission. Your location is only shown after you choose <b>Allow</b>.</p>
<button onclick="shareLocation()">Share my current location</button>
<div id="result"></div>
<p class="small">You can close this page or revoke location permission at any time.</p>
</div>
<script>
function shareLocation(){
 const r=document.getElementById('result');
 r.textContent='Requesting location permission…';
 if(!navigator.geolocation){r.textContent='Geolocation is not supported by this browser.';return;}
 navigator.geolocation.getCurrentPosition(pos=>{
   const lat=pos.coords.latitude, lon=pos.coords.longitude;
   const acc=Math.round(pos.coords.accuracy);
   const maps=`https://www.google.com/maps?q=${lat},${lon}`;
   r.innerHTML=`<b>Location shared.</b><br>Latitude: ${lat.toFixed(6)}<br>Longitude: ${lon.toFixed(6)}<br>Accuracy: about ${acc} m<br><a href="${maps}" target="_blank" rel="noopener">Open in Google Maps</a>`;
 },err=>{
   r.textContent='Location was not shared. Please allow location permission and try again.';
 });
}
</script>
</body>
</html>
