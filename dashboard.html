<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Location Dashboard</title>
<style>body{font-family:system-ui;margin:0;padding:20px;background:#f4f7fb;color:#172033}.card{max-width:650px;margin:25px auto;background:#fff;padding:24px;border-radius:20px;box-shadow:0 8px 30px #0001}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border:1px solid #ccd3df;border-radius:10px}button{padding:13px 18px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-weight:700;margin-top:8px}.logout{background:#667085}a{color:#1769e0;font-weight:700}.error{color:#b42318}.muted{color:#667085}.location{border-top:1px solid #e5e7eb;margin-top:20px;padding-top:18px}</style></head>
<body><div class="card"><h1>🔐 Location Dashboard</h1><div id="login"><p class="muted">Owner login required.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button><div id="loginStatus"></div></div>
<div id="panel" style="display:none"><button id="logoutBtn" class="logout">Log out</button><div id="locations">Loading shared locations…</div></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBjnpsbJz53WA9UZi_G3rAFn3QiHQR5aO",
  authDomain: "location-share-c09fd.firebaseapp.com",
  projectId: "location-share-c09fd",
  storageBucket: "location-share-c09fd.firebasestorage.app",
  messagingSenderId: "627365891201",
  appId: "1:627365891201:web:2dafb64cfb4071cec61180",
  measurementId: "G-X79LGRJP3L"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const login=document.getElementById("login"),panel=document.getElementById("panel"),status=document.getElementById("loginStatus"),locations=document.getElementById("locations");
document.getElementById("loginBtn").onclick=async()=>{status.textContent="Logging in…";try{await signInWithEmailAndPassword(auth,document.getElementById("email").value.trim(),document.getElementById("password").value);}catch(e){status.innerHTML='<span class="error">Login failed. Check your email/password.</span>';}};
document.getElementById("logoutBtn").onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{
 if(!user){login.style.display="block";panel.style.display="none";return;}
 login.style.display="none";panel.style.display="block";
 onValue(ref(db,"shares"),snap=>{
  const data=snap.val()||{},rows=Object.entries(data).map(([id,v])=>({id,...v})).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  if(!rows.length){locations.innerHTML="<p>No location has been shared yet.</p>";return;}
  const x=rows[0],time=x.timestamp?new Date(x.timestamp).toLocaleString():"Unknown",maps="https://www.google.com/maps?q="+x.latitude+","+x.longitude;
  locations.innerHTML="<div class='location'><h2>Latest shared location</h2><p><b>Latitude:</b> "+x.latitude+"</p><p><b>Longitude:</b> "+x.longitude+"</p><p><b>Accuracy:</b> "+Math.round(x.accuracy||0)+" metres</p><p><b>Time:</b> "+time+"</p><p><a href='"+maps+"' target='_blank' rel='noopener'>📍 Open in Google Maps</a></p></div><p class='muted'>Showing the newest shared location.</p>";
 });
});
</script></body></html>
